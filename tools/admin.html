<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard admin</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    label { display: block; margin: .8rem 0 .2rem; font-weight: 600; }
    input, select, button { font: inherit; padding: .5rem; width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; cursor: pointer; }
    .row { display: flex; gap: .5rem; align-items: flex-end; }
    .row > div { flex: 1; }
    #msg { margin: 1rem 0; min-height: 1.4em; }
    .warning-box {
      margin: 1rem 0;
      padding: .75rem 1rem;
      background-color: #ffe6e6;
      border: 1px solid #ff4d4d;
      border-radius: 4px;
      color: #990000;
      font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    td { padding: .3rem; border-bottom: 1px solid #ddd; }
    td:last-child { text-align: right; }
  </style>
</head>
<body>
<h1>Leaderboard admin</h1>
<p>This page only runs on your computer. It is not part of the website.</p>
<button id="open">Open times.json</button>

<div id="editor" hidden>
  <div class="row">
    <div><label for="year">Year</label><select id="year"></select></div>
    <div><label for="sem">Semester</label>
      <select id="sem"><option value="sem1">Semester 1</option><option value="sem2">Semester 2</option></select></div>
    <div><button id="newYear">Add year</button></div>
  </div>

  <label for="name">Name (type a new name to add someone)</label>
  <input id="name" list="names" autocomplete="off">
  <datalist id="names"></datalist>

  <label for="time">Lap time (seconds)</label>
  <input id="time" type="number" step="0.001" min="0">

  <button id="add">Add time</button>
  <div id="new-member-warning" class="warning-box" hidden>
    New member, check if they are registered on the Sports and Societies website
  </div>
  <div id="msg" role="status"></div>
  <button id="save">Save times.json</button>
  <table id="list"></table>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let data = {};      // the whole times.json
  let fileHandle = null; // lets Chrome/Edge save straight back into the file

  const say = (text) => { $("msg").textContent = text; };

  // Helper to retrieve all unique names present across all years and semesters
  function getAllExistingNames() {
    const names = new Set();
    for (const yearObj of Object.values(data)) {
      for (const semObj of Object.values(yearObj)) {
        for (const name of Object.keys(semObj)) {
          names.add(name);
        }
      }
    }
    return names;
  }

  // Fallback file picker for browsers without showOpenFilePicker (e.g. Safari)
  const pickWithInput = () => new Promise((resolve) => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";
    input.onchange = () => input.files[0].text().then(resolve);
    input.click();
  });

  async function openFile() {
    let text;
    if (window.showOpenFilePicker) {
      [fileHandle] = await window.showOpenFilePicker({ types: [{ accept: { "application/json": [".json"] } }] });
      text = await (await fileHandle.getFile()).text();
    } else {
      text = await pickWithInput();
    }
    data = JSON.parse(text);
    $("editor").hidden = false;
    refresh();
    say(fileHandle ? "Opened. Save will write straight to this file." : "Opened. Save will download a new times.json.");
  }

  // Rebuild the year dropdown, the name suggestions and the table
  function refresh() {
    const yearEl = $("year");
    const selected = yearEl.value;

    yearEl.innerHTML = Object.keys(data).sort().map((y) => `<option>${y}</option>`).join("");
    if (data[selected]) yearEl.value = selected;
    else yearEl.value = Object.keys(data).sort().pop();

    const names = getAllExistingNames();
    $("names").innerHTML = [...names].sort().map((n) => `<option value="${n.replace(/"/g, "&quot;")}">`).join("");

    const current = (data[yearEl.value] || {})[$("sem").value] || {};
    $("list").innerHTML = Object.entries(current)
            .sort((a, b) => a[1] - b[1])
            .map(([n, t]) => `<tr><td></td><td>${t.toFixed(3)}</td></tr>`.replace("<td></td>", `<td>${n.replace(/</g, "&lt;")}</td>`))
            .join("");
  }

  function addTime() {
    const year = $("year").value, sem = $("sem").value;
    const name = $("name").value.trim(), time = parseFloat($("time").value);
    if (!name || !(time > 0)) return say("Enter a name and a lap time.");

    // Check if the name exists anywhere in times.json prior to adding
    const existingNames = getAllExistingNames();
    const isNewMember = !existingNames.has(name);

    data[year][sem] = data[year][sem] || {};
    const old = data[year][sem][name];

    if (old !== undefined && time >= old) {
      // Not faster, so keep the existing time
      say(`${name} already has ${old.toFixed(3)}, which is faster or equal, so nothing changed.`);
      $("new-member-warning").hidden = true;
    } else {
      data[year][sem][name] = time;
      say(old === undefined
              ? `Added ${name}: ${time.toFixed(3)}. Click Save when you are done.`
              : `Updated ${name}: ${old.toFixed(3)} → ${time.toFixed(3)}. Click Save when you are done.`);

      // Show/hide red warning box based on whether this was a brand-new member
      $("new-member-warning").hidden = !isNewMember;
    }
    $("name").value = "";
    $("time").value = "";
    refresh();
    $("name").focus();
  }

  async function save() {
    const text = JSON.stringify(data, null, 2) + "\n";
    if (fileHandle) {
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      say("Saved. Now push to GitHub.");
    } else {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      link.download = "times.json";
      link.click();
      say("Downloaded times.json. Replace the one in src/data/ with it, then push.");
    }
  }

  function newYear() {
    const year = (prompt("Academic year, e.g. 2027-2028") || "").trim();
    if (!/^\d{4}-\d{4}$/.test(year)) return;
    data[year] = data[year] || { sem1: {}, sem2: {} };
    refresh();
    $("year").value = year;
    refresh();
  }

  $("open").onclick = () => openFile().catch((e) => say("Could not open file: " + e.message));
  $("add").onclick = addTime;
  $("save").onclick = () => save().catch((e) => say("Could not save: " + e.message));
  $("newYear").onclick = newYear;
  $("year").onchange = refresh;
  $("sem").onchange = refresh;
  $("time").onkeydown = (e) => { if (e.key === "Enter") addTime(); };
</script>
</body>
</html>
